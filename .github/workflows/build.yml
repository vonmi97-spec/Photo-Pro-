name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "Signature fixe activée"
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : signature temporaire"
          fi
      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk Appareil-Photo-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Appareil-Photo-Pro-APK
          path: Appareil-Photo-Pro.apk
