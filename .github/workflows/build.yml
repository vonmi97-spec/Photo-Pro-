name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t"' > /tmp/ks.b64
            echo "::notice::Secret KEYSTORE_BASE64 : $(wc -c < /tmp/ks.b64) caractères (attendu 3516), début $(head -c 6 /tmp/ks.b64), fin $(tail -c 6 /tmp/ks.b64)"
            if base64 -d -i /tmp/ks.b64 > app/release.jks 2>/dev/null; then
              echo "Signature fixe activée"
            else
              echo "::error::KEYSTORE_BASE64 illisible : longueur $(wc -c < /tmp/ks.b64) au lieu de 3516"
              exit 1
            fi
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : signature temporaire"
          fi
      - name: Vérifier la clé
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f app/release.jks ]; then
            H=$(sha256sum app/release.jks | cut -c1-16)
            P=$(printf '%s' "$KEYSTORE_PASSWORD" | wc -c)
            echo "::notice::Empreinte clé $H, mot de passe $P caractères"
            if ! keytool -list -keystore app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias photopro > /dev/null 2>&1; then
              echo "::error::Clé refusée (empreinte $H, mot de passe $P caractères)"
              exit 1
            fi
          fi
      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk Appareil-Photo-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Appareil-Photo-Pro-APK
          path: Appareil-Photo-Pro.apk
